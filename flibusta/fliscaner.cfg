	"zip": {
		"path": "http://x.flibusta.is/",
		"file": "daily/",
		"regexp": [
			"f\\.(fb2|n)\\.\\d+-\\d+\\.zip"
		]
	},
	"scripts": [
		{
			"regexp": "^f\\.n\\.\\d+-\\d+\\.zip$",
			"command": "fb2cut.exe",
			"args": "#FILE# -o #DIR#/../../recoded -q 69 --max-size 1440 --ffmpeg D:/programs/ffmpeg/9.0.1/bin/ffmpeg.exe --output-name f.usr-000000-999999 --append-mode"
		},
		{
			"regexp": "^f\\.fb2\\.\\d+-\\d+\\.zip$",
			"command": "fb2cut.exe",
			"args": "#FILE# -o #DIR#/../../recoded -q 69 --max-size 1440 --ffmpeg D:/programs/ffmpeg/9.0.1/bin/ffmpeg.exe --output-name f.fb2-000000-999999 --append-mode"
		}
	]
