{
	"sql": {
		"path": "https://lib.rusec.net/sql/",
		"file": [
			"libavtor.sql.gz",
			"libavtors.sql.gz",
			"libbook.sql.gz",
			"libgenre.sql.gz",
			"libgenres.sql.gz",
			"libmag.sql.gz",
			"libmags.sql.gz",
			"libpolka.sql.gz",
			"libquality.sql.gz",
			"librate.sql.gz",
			"libseq.sql.gz",
			"libseqs.sql.gz"
		]
	},
	"zip": {
		"path": "https://lib.rusec.net/",
		"file": "daily/",
		"regexp": [
			"2026-10-[0-9]{2}\\.[0-9]+-[0-9]+\\.[0-9]+\\..*?\\.zip"
		]
	},
	"scripts": [
		{
			"regexp": "^(?!.*\\.fb2).*\\.zip$",
			"command": "fb2cut.exe",
			"args": "#FILE# -o #DIR#/../../recoded -q 69 --max-size 1440 --ffmpeg D:/programs/ffmpeg/9.0.1/bin/ffmpeg.exe --output-name usr-000000-999999 --append-mode"
		},
		{
			"regexp": "^.*\\.fb2\\.zip$",
			"command": "fb2cut.exe",
			"args": "#FILE# -o #DIR#/../../recoded -q 69 --max-size 1440 --ffmpeg D:/programs/ffmpeg/9.0.1/bin/ffmpeg.exe --output-name fb2-000000-999999 --append-mode"
		}
	]
}
